name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Linux only for the moment: the macOS runs are deferred (ADR-CI-LINUX-ONLY).
#
# The branch protection of `main` requires two status checks, the jobs named
# `Build, lint, test and format` (`check`) and `End-to-end tests` (`e2e`).
# `check` gathers the results of `build-lint-format`, `plan-shards` and the
# four sharded unit test jobs `test-1`..`test-4`; `e2e` gathers `e2e-stable`
# and `e2e-msrv`. None of the underlying jobs is a required check itself.
# Renaming a required job, or adding a job that must pass, means changing the
# branch protection too, or pull requests wait for a check that never reports.
jobs:
  build-lint-format:
    name: Build, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version that `packageManager` in package.json names.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build lint
      # Without `--all`, Nx checks only the files changed against the base.
      - run: pnpm nx format:check --all
      - name: Install zban
        env:
          ZBAN_VERSION: 0.1.0
          ZBAN_SHA256: 4ebcbe6d0719100c6704acd4e38c15db5261803e4541ddd74dc248021458d942
        run: |
          archive=zban-x86_64-unknown-linux-musl.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/convesoft/zban/releases/download/v$ZBAN_VERSION/$archive"
          echo "$ZBAN_SHA256  $archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" zban
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: zban check
      # `mara schema validate` and `mara project validate` do not run here yet:
      # the knowledge base needs a Mara version that is not published
      # (nxr-0x99we). Until then they are run locally.

  # Restores the latest CI per-suite timing profile once per workflow run and
  # passes that exact snapshot to every shard, so all four shards compute the
  # same LPT partition even if another push updates the cache mid-run.
  plan-shards:
    name: Plan test shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      timings: ${{ steps.load.outputs.timings }}
    steps:
      - name: Restore test timings
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/jest-timings.json
          key: jest-timings-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            jest-timings-${{ runner.os }}-${{ runner.arch }}-
      - name: Emit pinned timings snapshot
        id: load
        env:
          TIMINGS_FILE: ${{ runner.temp }}/jest-timings.json
        run: |
          node -e '
            const fs = require("node:fs");
            const file = process.env.TIMINGS_FILE;
            let clean = {};
            if (fs.existsSync(file)) {
              try {
                const parsed = JSON.parse(fs.readFileSync(file, "utf8"));
                if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
                  for (const [k, v] of Object.entries(parsed)) {
                    if (typeof v === "number" && Number.isFinite(v) && v >= 0) clean[k] = Math.round(v);
                  }
                }
              } catch {}
            }
            console.log(`Loaded ${Object.keys(clean).length} cached suite timings`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `timings=${JSON.stringify(clean)}\n`);
          '

  # The unit test suite runs across four shards at the same time, LPT-packed by
  # `nx-rust/jest.sequencer.cjs` from the pinned timing profile. They are four
  # explicit jobs rather than a matrix for the same reason as `e2e-stable` and
  # `e2e-msrv` below: `check` verifies that each shard's result is literally
  # `success`.
  test-1:
    name: Unit tests (shard 1/4)
    needs: [plan-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      timings: ${{ steps.run.outputs.timings }}
    steps:
      - uses: actions/checkout@v7
      - id: run
        uses: ./.github/actions/unit-tests
        with:
          shard: 1/4
          timings: ${{ needs.plan-shards.outputs.timings }}

  test-2:
    name: Unit tests (shard 2/4)
    needs: [plan-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      timings: ${{ steps.run.outputs.timings }}
    steps:
      - uses: actions/checkout@v7
      - id: run
        uses: ./.github/actions/unit-tests
        with:
          shard: 2/4
          timings: ${{ needs.plan-shards.outputs.timings }}

  test-3:
    name: Unit tests (shard 3/4)
    needs: [plan-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      timings: ${{ steps.run.outputs.timings }}
    steps:
      - uses: actions/checkout@v7
      - id: run
        uses: ./.github/actions/unit-tests
        with:
          shard: 3/4
          timings: ${{ needs.plan-shards.outputs.timings }}

  test-4:
    name: Unit tests (shard 4/4)
    needs: [plan-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      timings: ${{ steps.run.outputs.timings }}
    steps:
      - uses: actions/checkout@v7
      - id: run
        uses: ./.github/actions/unit-tests
        with:
          shard: 4/4
          timings: ${{ needs.plan-shards.outputs.timings }}

  # The required check `Build, lint, test and format`: it passes only when
  # build/lint/format, shard planning and every unit test shard succeeded, and
  # then saves the merged suite timings to cache for future runs.
  check:
    name: Build, lint, test and format
    needs: [build-lint-format, plan-shards, test-1, test-2, test-3, test-4]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that build, lint, format and all test shards passed
        env:
          BUILD_LINT_FORMAT: ${{ needs.build-lint-format.result }}
          PLAN_SHARDS: ${{ needs.plan-shards.result }}
          TEST_1: ${{ needs.test-1.result }}
          TEST_2: ${{ needs.test-2.result }}
          TEST_3: ${{ needs.test-3.result }}
          TEST_4: ${{ needs.test-4.result }}
        run: |
          echo "Build, lint and format: $BUILD_LINT_FORMAT"
          echo "Plan test shards: $PLAN_SHARDS"
          echo "Unit tests (shard 1/4): $TEST_1"
          echo "Unit tests (shard 2/4): $TEST_2"
          echo "Unit tests (shard 3/4): $TEST_3"
          echo "Unit tests (shard 4/4): $TEST_4"
          test "$BUILD_LINT_FORMAT" = success
          test "$PLAN_SHARDS" = success
          test "$TEST_1" = success
          test "$TEST_2" = success
          test "$TEST_3" = success
          test "$TEST_4" = success
      - name: Merge shard timings
        env:
          T1: ${{ needs.test-1.outputs.timings }}
          T2: ${{ needs.test-2.outputs.timings }}
          T3: ${{ needs.test-3.outputs.timings }}
          T4: ${{ needs.test-4.outputs.timings }}
          TIMINGS_FILE: ${{ runner.temp }}/jest-timings.json
        run: |
          node -e '
            const fs = require("node:fs");
            const merged = {};
            for (const raw of [process.env.T1, process.env.T2, process.env.T3, process.env.T4]) {
              if (!raw) continue;
              const parsed = JSON.parse(raw);
              for (const [k, v] of Object.entries(parsed)) {
                if (typeof v === "number" && Number.isFinite(v) && v >= 0) merged[k] = Math.round(v);
              }
            }
            const sorted = Object.fromEntries(Object.entries(merged).sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0)));
            fs.writeFileSync(process.env.TIMINGS_FILE, JSON.stringify(sorted));
            const totals = [process.env.T1, process.env.T2, process.env.T3, process.env.T4].map((raw, i) => {
              const obj = raw ? JSON.parse(raw) : {};
              const ms = Object.values(obj).reduce((s, n) => s + (typeof n === "number" ? n : 0), 0);
              return `shard ${i + 1}: ${Object.keys(obj).length} suites, ${(ms / 1000).toFixed(1)}s`;
            });
            console.log(`Merged ${Object.keys(sorted).length} suite timings (${totals.join(" | ")})`);
          '
      - name: Save test timings
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/jest-timings.json
          key: jest-timings-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}

  # The suite runs against the latest stable Cargo and against 1.91.0, the
  # oldest Cargo the plugin supports (REQ-COMPATIBILITY, VER-SETUP), in two
  # jobs that run at the same time. They are two jobs rather than a matrix so
  # that `e2e` can check the result of each one: GitHub does not document how
  # it combines the legs of a matrix into one result, and a leg cancelled
  # before it got a runner has been seen to leave that result `success`. Their
  # steps are the local action `.github/actions/e2e`, which needs the checkout
  # before it.
  e2e-stable:
    name: End-to-end tests on Cargo stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          toolchain: stable

  e2e-msrv:
    name: End-to-end tests on Cargo 1.91.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          toolchain: "1.91.0"

  # The required check `End-to-end tests`: it passes only when the suite
  # passed on both toolchains. It runs also when a job it needs failed, was
  # cancelled or was skipped, so that it reports a failure instead of being
  # skipped itself, which the branch protection of `main` would count as a
  # pass. Each result has to be exactly `success`.
  e2e:
    name: End-to-end tests
    needs: [e2e-stable, e2e-msrv]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the suite passed on both toolchains
        env:
          STABLE: ${{ needs.e2e-stable.result }}
          MSRV: ${{ needs.e2e-msrv.result }}
        run: |
          echo "Cargo stable: $STABLE"
          echo "Cargo 1.91.0: $MSRV"
          test "$STABLE" = success
          test "$MSRV" = success
