name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Linux only for the moment: the macOS runs are deferred (ADR-CI-LINUX-ONLY).
jobs:
  check:
    name: Build, lint, test and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version that `packageManager` in package.json names.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t build lint test
      - run: pnpm format:check
      - name: Install zban
        env:
          ZBAN_VERSION: 0.1.0
          ZBAN_SHA256: 4ebcbe6d0719100c6704acd4e38c15db5261803e4541ddd74dc248021458d942
        run: |
          archive=zban-x86_64-unknown-linux-musl.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/convesoft/zban/releases/download/v$ZBAN_VERSION/$archive"
          echo "$ZBAN_SHA256  $archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" zban
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: zban check
      # `mara schema validate` and `mara project validate` do not run here yet:
      # the knowledge base needs a Mara version that is not published
      # (nxr-0x99we). Until then they are run locally.

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx e2e nx-rust-e2e
