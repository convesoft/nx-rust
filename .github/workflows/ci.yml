name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Linux only for the moment: the macOS runs are deferred (ADR-CI-LINUX-ONLY).
#
# The branch protection of `main` requires two status checks, the jobs named
# `Build, lint, test and format` (`check`) and `End-to-end tests` (`e2e`).
# `e2e` only gathers the results of `e2e-stable` and `e2e-msrv`, which run
# the end-to-end suite on one toolchain each, at the same time, and are not
# required checks themselves. Renaming a required job, or adding a job that
# must pass, means changing the branch protection too, or pull requests wait
# for a check that never reports.
jobs:
  check:
    name: Build, lint, test and format
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version that `packageManager` in package.json names.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # The fixture tests run cargo, and the `lint`, `fmt` and `fmt-check`
      # targets run clippy and rustfmt. `1.91.0` is the toolchain that the
      # `different-toolchains` fixture pins (nx-rust/test/README.md).
      - name: Install the Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.91.0 --profile minimal
          rustup default stable
          cargo --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build lint test
      # Without `--all`, Nx checks only the files changed against the base.
      - run: pnpm nx format:check --all
      - name: Install zban
        env:
          ZBAN_VERSION: 0.1.0
          ZBAN_SHA256: 4ebcbe6d0719100c6704acd4e38c15db5261803e4541ddd74dc248021458d942
        run: |
          archive=zban-x86_64-unknown-linux-musl.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/convesoft/zban/releases/download/v$ZBAN_VERSION/$archive"
          echo "$ZBAN_SHA256  $archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" zban
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: zban check
      # `mara schema validate` and `mara project validate` do not run here yet:
      # the knowledge base needs a Mara version that is not published
      # (nxr-0x99we). Until then they are run locally.

  # The suite runs against the latest stable Cargo and against 1.91.0, the
  # oldest Cargo the plugin supports (REQ-COMPATIBILITY, VER-SETUP), in two
  # jobs that run at the same time. They are two jobs rather than a matrix so
  # that `e2e` can check the result of each one: GitHub does not document how
  # it combines the legs of a matrix into one result, and a leg cancelled
  # before it got a runner has been seen to leave that result `success`. Their
  # steps are the local action `.github/actions/e2e`, which needs the checkout
  # before it.
  e2e-stable:
    name: End-to-end tests on Cargo stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          toolchain: stable

  e2e-msrv:
    name: End-to-end tests on Cargo 1.91.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          toolchain: "1.91.0"

  # The required check `End-to-end tests`: it passes only when the suite
  # passed on both toolchains. It runs also when a job it needs failed, was
  # cancelled or was skipped, so that it reports a failure instead of being
  # skipped itself, which the branch protection of `main` would count as a
  # pass. Each result has to be exactly `success`.
  e2e:
    name: End-to-end tests
    needs: [e2e-stable, e2e-msrv]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the suite passed on both toolchains
        env:
          STABLE: ${{ needs.e2e-stable.result }}
          MSRV: ${{ needs.e2e-msrv.result }}
        run: |
          echo "Cargo stable: $STABLE"
          echo "Cargo 1.91.0: $MSRV"
          test "$STABLE" = success
          test "$MSRV" = success
