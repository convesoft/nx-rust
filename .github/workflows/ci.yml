name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Linux only for the moment: the macOS runs are deferred (ADR-CI-LINUX-ONLY).
#
# The names of both jobs are required status checks in the branch protection
# of `main`. Change a name there too, or pull requests wait for a check that
# never reports.
jobs:
  check:
    name: Build, lint, test and format
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version that `packageManager` in package.json names.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # The fixture tests run cargo, and the `lint`, `fmt` and `fmt-check`
      # targets run clippy and rustfmt. `1.91.0` is the toolchain that the
      # `different-toolchains` fixture pins (nx-rust/test/README.md).
      - name: Install the Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.91.0 --profile minimal
          rustup default stable
          cargo --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build lint test
      # Without `--all`, Nx checks only the files changed against the base.
      - run: pnpm nx format:check --all
      - name: Install zban
        env:
          ZBAN_VERSION: 0.1.0
          ZBAN_SHA256: 4ebcbe6d0719100c6704acd4e38c15db5261803e4541ddd74dc248021458d942
        run: |
          archive=zban-x86_64-unknown-linux-musl.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/convesoft/zban/releases/download/v$ZBAN_VERSION/$archive"
          echo "$ZBAN_SHA256  $archive" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" zban
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: zban check
      # `mara schema validate` and `mara project validate` do not run here yet:
      # the knowledge base needs a Mara version that is not published
      # (nxr-0x99we). Until then they are run locally.

  # The suite runs twice, against the latest stable Cargo and against 1.91.0,
  # the oldest Cargo the plugin supports (REQ-COMPATIBILITY, VER-SETUP). Both
  # runs are steps of this job, so that its name stays the required check. The
  # harness drops `RUSTUP_TOOLCHAIN` from the commands it runs, so `rustup
  # default` chooses the toolchain of each run.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # The `lint`, `fmt` and `fmt-check` targets run clippy and rustfmt, so
      # both toolchains need them.
      - name: Install the Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.91.0 --profile minimal --component clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Run the end-to-end tests with the latest stable Cargo
        id: e2e-stable
        run: |
          rustup default stable
          cargo --version
          pnpm nx e2e nx-rust-e2e
      # Also after a failure on stable, so that one CI run reports both
      # toolchains. The e2e target's inputs include what cargo and rustup say
      # about the toolchains (`rustToolchains` in nx.json), so this run does
      # not replay the first one's result from the Nx cache.
      - name: Run the end-to-end tests with Cargo 1.91.0
        if: ${{ !cancelled() && steps.e2e-stable.outcome != 'skipped' }}
        run: |
          rustup default 1.91.0
          cargo --version
          pnpm nx e2e nx-rust-e2e
